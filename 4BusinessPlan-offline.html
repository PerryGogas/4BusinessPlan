<style>
:root{
  --bg:#f5f3ec;--card:#fffdf8;--ink:#1b2433;--mut:#66758a;--line:#ddd8cb;--navy:#1f3a5f;--teal:#2a9d8f;--amber:#e9b949;--coral:#e76f51;--sky:#5b8def;--green:#3ba776;
  --inbg:#fff6d6;--inbd:#e3cf8a;--pale:#eef1f5;--head:#1f3a5f;--headink:#ffffff;--shadow:0 1px 2px rgba(27,36,51,.06),0 4px 14px rgba(27,36,51,.05);
  --font:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
}
[data-theme="dark"]{
  --bg:#12171f;--card:#1a212c;--ink:#e6ebf2;--mut:#95a3b7;--line:#2c3644;--navy:#8fb4e8;--teal:#4cc3b3;--amber:#f0c869;--coral:#f08a70;--sky:#86a9f5;--green:#5cc594;
  --inbg:#2c2a1b;--inbd:#5c5330;--pale:#222b38;--head:#0e1420;--headink:#e6ebf2;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
#app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header.top{background:var(--head);color:var(--headink);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:20px;letter-spacing:.2px}
.brand .four{color:#7fd1c6}.brand .ver{font-size:12px;font-weight:500;opacity:.75}
.brand a{font-size:12px;font-weight:500;color:#c9d6e8;text-decoration:none}.brand a:hover{text-decoration:underline}
.top .sp{flex:1}
.tb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--teal)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.warn{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
header.top .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
header.top .btn:hover{background:rgba(255,255,255,.2)}
header.top select{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:6px 8px;font-weight:600;font-size:13px}
header.top select option{color:#1b2433}
.chip{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:700;background:rgba(255,255,255,.14)}
.chip.shock{background:var(--coral);color:#fff}
#wrap{display:grid;grid-template-columns:232px 1fr;min-height:0}
nav.side{background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:10px 8px}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);margin:12px 10px 4px;font-weight:700}
nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;cursor:pointer;font-weight:500}
nav a:hover{background:var(--pale)}
nav a.on{background:var(--navy);color:#fff}[data-theme="dark"] nav a.on{color:#0e1420}
nav a .n{width:20px;height:20px;border-radius:50%;background:var(--pale);color:var(--mut);font-size:11px;display:grid;place-items:center;font-weight:700;flex:none}
nav a.on .n{background:rgba(255,255,255,.25);color:inherit}
nav a .dot{margin-left:auto;width:8px;height:8px;border-radius:50%}
main{overflow:auto;padding:22px 26px 60px}
.page{max-width:1280px;margin:0 auto}
h1.pt{font-size:24px;margin:0 0 4px;color:var(--navy)}
.sub{color:var(--mut);margin:0 0 18px}
h2.bh{font-size:16px;margin:26px 0 10px;color:var(--navy);border-bottom:2px solid var(--line);padding-bottom:5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:14px;color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2>.card{margin-bottom:0}.grid2{margin-bottom:16px}
@media(max-width:1000px){.grid2{grid-template-columns:1fr}#wrap{grid-template-columns:1fr}nav.side{display:flex;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}nav .grp{display:none}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:24px;font-weight:700;color:var(--navy);margin-top:2px}
.kpi.t1{border-top-color:var(--teal)}.kpi.t2{border-top-color:var(--sky)}.kpi.t3{border-top-color:var(--amber)}.kpi.t4{border-top-color:var(--green)}.kpi.t5{border-top-color:var(--coral)}.kpi.t6{border-top-color:var(--mut)}
.kpi .d{font-size:12px;margin-top:2px}.up{color:var(--green)}.down{color:var(--coral)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:var(--pale);color:var(--navy);text-align:right;padding:7px 9px;border-bottom:2px solid var(--navy);font-size:12px;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.t tr.tot td{font-weight:700;background:var(--pale);border-top:1px solid var(--navy)}
table.t tr.sec td{background:var(--navy);color:#fff;font-weight:700;font-size:12px;letter-spacing:.4px}[data-theme="dark"] table.t tr.sec td{color:#0e1420}
table.t tr.mut td{color:var(--mut);font-style:italic}
table.t td.ind{padding-left:22px}
table.t td.neg{color:var(--coral)}
.tw{overflow:auto}
.note{font-size:12px;color:var(--mut);font-style:italic;margin-top:8px}
.expl{background:var(--pale);border-left:4px solid var(--sky);padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:13px}
.q{border-left:4px solid var(--teal);padding:10px 14px;margin-top:12px;background:color-mix(in srgb,var(--teal) 8%,var(--card));border-radius:6px}
.q .qt{font-weight:600;color:var(--teal);margin-bottom:6px;font-size:13px}
.q textarea{width:100%;min-height:92px;border:1px solid var(--inbd);background:var(--inbg);border-radius:6px;padding:8px 10px;resize:vertical;line-height:1.5}
.q .wc{font-size:11px;color:var(--mut);text-align:right;margin-top:3px}
input.in,select.in,textarea.in{border:1px solid var(--inbd);background:var(--inbg);border-radius:6px;padding:5px 8px;width:100%}
input.in.num{text-align:right;font-variant-numeric:tabular-nums}
input.in:focus,textarea:focus,select.in:focus{outline:2px solid var(--teal);outline-offset:0}
table.it{border-collapse:collapse;width:100%}
table.it th{font-size:12px;color:var(--navy);text-align:left;padding:4px 6px;border-bottom:2px solid var(--navy);white-space:nowrap}
table.it td{padding:3px 4px}
table.it td.lab{padding:5px 6px;min-width:220px}
table.it td.fx{text-align:right;font-weight:700;padding-right:10px;font-variant-numeric:tabular-nums}
.frm{display:grid;grid-template-columns:minmax(220px,340px) 180px 1fr;gap:8px 12px;align-items:center}
.frm .h{color:var(--mut);font-size:12px;font-style:italic}
.x{border:0;background:none;color:var(--coral);cursor:pointer;font-size:16px;font-weight:700;padding:0 6px}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12px;color:#fff}
.badge.ok{background:var(--green)}.badge.low{background:var(--amber);color:#1b2433}.badge.bad{background:var(--coral)}
.checks{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center}
.steps{display:grid;grid-template-columns:auto 170px 1fr auto;gap:8px 14px;align-items:center}
.steps .n{width:24px;height:24px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.steps a{color:var(--navy);font-weight:700;cursor:pointer;text-decoration:underline}
.tag{font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:2px 8px;text-align:center}
.tag.in{background:var(--amber);color:#1b2433}.tag.out{background:var(--teal)}.tag.an{background:var(--sky)}.tag.dl{background:var(--navy)}[data-theme="dark"] .tag.dl{color:#0e1420}
table.it td:first-child{min-width:250px}
.cbox{position:relative;height:300px}
.shockbox{border:2px dashed var(--coral);border-radius:10px;padding:18px;background:color-mix(in srgb,var(--coral) 7%,var(--card))}
.shockbox h3{color:var(--coral);font-size:18px;margin:0 0 6px}
.radar4{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:1000px){.radar4{grid-template-columns:1fr}}
#toast{position:fixed;bottom:18px;right:18px;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;pointer-events:none;font-weight:600;z-index:50}
#toast.on{opacity:1}
/* report */
.rep{background:#fff;color:#1b2433;border:1px solid var(--line);border-radius:6px;padding:34px 40px;max-width:900px;margin:0 auto;box-shadow:var(--shadow)}
.rep h1{font-size:26px;color:#1f3a5f;margin:0 0 6px}.rep h2{font-size:18px;color:#1f3a5f;border-bottom:2px solid #1f3a5f;padding-bottom:4px;margin:28px 0 10px}
.rep h3{font-size:14px;color:#1f3a5f;margin:18px 0 6px}
.rep table{width:100%;border-collapse:collapse;font-size:11.5px;margin:6px 0 12px}
.rep th{background:#eef1f5;color:#1f3a5f;text-align:right;padding:5px 7px;border-bottom:2px solid #1f3a5f}
.rep td{padding:4px 7px;border-bottom:1px solid #dde2ea;text-align:right}
.rep th:first-child,.rep td:first-child{text-align:left}
.rep tr.tot td{font-weight:700;background:#f3f6fa}.rep tr.sec td{background:#1f3a5f;color:#fff;font-weight:700}
.rep img{max-width:100%;display:block;margin:8px auto}
.rep .rq{font-style:italic;color:#2a9d8f;margin:10px 0 4px;font-size:12.5px}
.rep .ra{white-space:pre-wrap;margin:0 0 10px;padding:8px 12px;background:#f8f9fb;border-left:3px solid #2a9d8f}
.rep .ra.empty{color:#b0563f;background:#fdf2ee;border-left-color:#e76f51}
.rep .cover{border-bottom:3px solid #1f3a5f;margin-bottom:18px;padding-bottom:14px}
.rep .cover .meta{color:#66758a;font-size:13px}
#printRoot{display:none}
@media print{
  body{background:#fff}#app,#toast{display:none!important}
  #printRoot{display:block}#printRoot .rep{border:0;box-shadow:none;padding:0;max-width:none}
  .rep h2,.rep h3{page-break-after:avoid;break-after:avoid}.rep table,.rep img{page-break-inside:avoid}
}

.brand .cred{font-size:12px;font-weight:500;color:#c9d6e8}
.credit{display:flex;gap:18px;align-items:center}
.credit img.l1{height:96px;width:auto;border-radius:6px;background:#fff;padding:4px 8px;flex:none}.credit img.l2{height:58px;width:auto;border-radius:6px;margin-left:auto;flex:none}
.credit .cn{font-size:18px;font-weight:700;color:var(--navy)}.credit .cl{color:var(--teal);font-weight:700}
.rep .rcred{display:flex;gap:14px;align-items:center;font-size:12px;color:#44546a;margin-bottom:22px}
.rep .rcred img.l1{height:78px;width:auto;margin:0}.rep .rcred img.l2{height:44px;width:auto;margin:0;border-radius:4px}

.brand a.hl{align-self:center;line-height:0}.brand a.hl img{height:30px;width:auto;border-radius:4px;display:block}
.ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tools{display:flex;gap:4px;flex:none;opacity:.6;transition:opacity .15s}.card:hover .tools{opacity:1}
.tools .btn{font-weight:500}
.btn[disabled]{opacity:.45;cursor:default}
.warnbox{background:color-mix(in srgb,var(--amber) 18%,var(--card));border-left:4px solid var(--amber);padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:13px}
.codebox{display:inline-block;border:1.5px solid #1f3a5f;border-radius:6px;padding:5px 12px;font-size:13px;margin-top:8px;background:#fff;color:#1b2433}
.codebox b{font-family:var(--mono);letter-spacing:1px;font-size:15px}
.rep .qs li{margin-bottom:8px;line-height:1.5}
table.t.te{font-size:12px}table.t.te td{white-space:nowrap}table.t.te th{white-space:normal;vertical-align:bottom;padding:6px 6px}table.t.te td{padding:5px 6px}
@media print{.rep .qs li{page-break-inside:avoid}}

/* ===== v3 ===== */
.credit .cn a{color:inherit;text-decoration:none}.credit .cn a:hover{text-decoration:underline}
.brand a.cred{font-size:12px;font-weight:500;color:#c9d6e8}
header.top .chip.bd{border:1px solid rgba(255,255,255,.25);color:#fff;cursor:pointer;font-size:13px;padding:5px 10px}
.dbox{width:100%}.dbox canvas{display:block}
.lcg{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:auto auto auto;gap:8px}
.lc{border:1.5px solid var(--navy);border-radius:8px;padding:6px 8px;background:var(--card);display:flex;flex-direction:column}
.lc .lct{font-weight:700;color:var(--navy);font-size:12.5px;margin-bottom:4px}
.lc textarea{flex:1;min-height:70px;width:100%;resize:vertical;font-size:12.5px;line-height:1.4}
.lc-problem{grid-column:1;grid-row:1/3}.lc-solution{grid-column:2;grid-row:1}.lc-metrics{grid-column:2;grid-row:2}.lc-uvp{grid-column:3;grid-row:1/3}.lc-advantage{grid-column:4;grid-row:1}.lc-channels{grid-column:4;grid-row:2}.lc-segments{grid-column:5;grid-row:1/3}.lc-costs{grid-column:1/3;grid-row:3}.lc-revenue{grid-column:3/6;grid-row:3}
.lc-problem textarea,.lc-uvp textarea,.lc-segments textarea{min-height:190px}
@media(max-width:1000px){.lcg{grid-template-columns:1fr 1fr}.lcg .lc{grid-column:auto!important;grid-row:auto!important}}
.bwrow{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;margin:6px 0}.bwrow input[type=range]{width:100%;accent-color:var(--teal)}.bwrow b{text-align:right;font-variant-numeric:tabular-nums}
.bwguess{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px;border:2px dashed var(--teal);border-radius:8px}
.bwres{margin-top:10px;padding:10px 12px;border-radius:8px;border-left:5px solid}.bwres.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--card))}.bwres.bad{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 10%,var(--card))}
.chip.q{background:var(--pale);color:var(--navy);font-size:13px}
.surv{display:flex;gap:28px;align-items:center}
.batt{width:86px;flex:none;display:flex;flex-direction:column;align-items:center}.batt-cap{width:30px;height:10px;background:var(--mut);border-radius:4px 4px 0 0}
.batt-body{position:relative;width:86px;height:170px;border:5px solid var(--mut);border-radius:12px;overflow:hidden;background:var(--pale)}
.batt-fill{position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--green);transition:height .25s,background .25s}
.batt-txt{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--ink);text-shadow:0 1px 2px rgba(255,255,255,.6)}
.persona .ph{display:flex;align-items:center;gap:12px;margin-bottom:10px}.persona .av{font-size:40px;line-height:1}.persona .pn{font-weight:800;font-size:17px;color:var(--navy)}
.persona .pl{list-style:none;margin:0;padding:0}.persona .pl li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}.persona .pl li span{flex:none;font-weight:800;width:18px}
.persona .pl li.ok span{color:var(--green)}.persona .pl li.warn span{color:#c98a00}.persona .pl li.bad span{color:var(--coral)}
.prog{height:10px;border-radius:99px;background:var(--pale);overflow:hidden;margin-bottom:12px}.prog div{height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));border-radius:99px;transition:width .4s}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.bd{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;opacity:.38;filter:grayscale(1)}.bd.on{opacity:1;filter:none;border-color:var(--teal);background:color-mix(in srgb,var(--teal) 8%,var(--card))}
.bd .bi{font-size:26px}.bd .bt{font-size:11.5px;line-height:1.25;margin-top:2px}
#lookPop{display:none;position:fixed;top:58px;right:14px;z-index:1000;width:320px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:14px}
#lookPop .lk-h{font-weight:800;color:var(--navy);margin-bottom:8px}#lookPop .lk-l{font-size:12px;color:var(--mut);margin:10px 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
#lookPop .sw{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#lookPop .swb{border:2px solid var(--line);border-radius:9px;background:var(--card);cursor:pointer;padding:6px 2px;display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
#lookPop .swb span{width:16px;height:16px;border-radius:50%;display:inline-block}#lookPop .swb em{flex-basis:100%;font-style:normal;font-size:10.5px;color:var(--ink);margin-top:2px}
#lookPop .swb.on{border-color:var(--teal);box-shadow:0 0 0 2px color-mix(in srgb,var(--teal) 35%,transparent)}
#lookPop .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}#lookPop .seg button{flex:1;border:0;background:var(--card);color:var(--ink);padding:7px 4px;cursor:pointer;font-weight:600;font-size:12.5px}#lookPop .seg button+button{border-left:1px solid var(--line)}#lookPop .seg button.on{background:var(--teal);color:#fff}

  function applyCode(v) {

  function fileBase() { return (S.team.company || '4BusinessPlan').replace(/[\\/:*?"<>|]+/g, '_').trim() || '4BusinessPlan'; }

  function onChange(e) {
